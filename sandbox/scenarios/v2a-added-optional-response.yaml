openapi: 3.0.3
info:
  title: "balance-service (provider) — v2a: +optional response field"
  version: 2.0.0
# МУТАЦИЯ: в ответ /balance ДОБАВЛЕНО необязательное поле promoCode. Потребитель его не читает.
paths:
  /transfers:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to, amount]
              properties:
                from:   { type: string }
                to:     { type: string }
                amount: { type: integer }
      responses:
        "200":
          description: created
          content:
            application/json:
              schema:
                type: object
                required: [transferId, status]
                properties:
                  transferId: { type: string }
                  status:     { type: string }
                  fee:        { type: integer }
  /accounts/{id}/balance:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [balance, currency]
                properties:
                  balance:   { type: integer }
                  currency:  { type: string }
                  promoCode: { type: string }
